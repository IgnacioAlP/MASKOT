<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Sistema - MASKOT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Fredoka+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: var(--maskot-background, #f5f5f5);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }

        .error-drawing {
            width: 200px;
            height: auto;
            margin-bottom: 30px;
        }

        .error-drawing .pup {
            animation: sadPup 2.5s ease-in-out infinite;
        }

        .error-drawing .tear {
            opacity: 0;
            animation: tearDrop 2.5s ease-in-out infinite;
            animation-delay: 1s;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: var(--maskot-primary, #ffa301);
            margin: 0;
        }

        h2 {
            font-size: 1.5rem;
            margin: 10px 0 20px;
            color: var(--maskot-secondary, #6ccae2);
        }

        p {
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .btn-back {
            background-color: var(--maskot-primary, #ffa301);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 163, 1, 0.4);
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 163, 1, 0.6);
        }

        @keyframes sadPup {

            0%,
            100% {
                transform: rotate(-2deg);
            }

            50% {
                transform: rotate(2deg);
            }
        }

        @keyframes tearDrop {

            0%,
            60% {
                opacity: 0;
                transform: translateY(0);
            }

            70% {
                opacity: 1;
                transform: translateY(10px);
            }

            100% {
                opacity: 0;
                transform: translateY(30px);
            }
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-drawing">
            <svg class="pup" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(5, 5)">
                    <path d="M 50,15 C 25,15 15,35 15,50 C 15,70 25,90 50,90 C 75,90 85,70 85,50 C 85,35 75,15 50,15 Z"
                        fill="#D2B48C" />
                    <path d="M 15,50 C 5,40 0,20 10,10 C 20,0 35,10 35,25" fill="#A0522D"
                        transform="rotate(-15, 15, 50)" />
                    <path d="M 85,50 C 95,40 100,20 90,10 C 80,0 65,10 65,25" fill="#A0522D"
                        transform="rotate(15, 85, 50)" />
                    <path d="M 50,65 C 40,65 35,75 35,80 C 35,85 40,90 50,90 C 60,90 65,85 65,80 C 65,75 60,65 50,65 Z"
                        fill="#F5DEB3" />
                    <circle cx="50" cy="70" r="5" fill="#222" />
                    <circle cx="35" cy="50" r="6" fill="#FFF" />
                    <circle cx="35" cy="50" r="3" fill="#222" />
                    <circle cx="65" cy="50" r="6" fill="#FFF" />
                    <circle cx="65" cy="50" r="3" fill="#222" />
                    <path d="M 40 80 Q 50 75 60 80" stroke="#222" stroke-width="1.5" fill="none" />
                    <path class="tear" d="M 38 60 Q 40 65 38 70 Q 36 65 38 60" fill="#6ccae2" />
                </g>
            </svg>
        </div>
        <h1>¡Oh, no!</h1>
        <h2>Parece que algo se enredó en el sistema.</h2>
        <p>Nuestro equipo de cachorros técnicos ya está trabajando para solucionarlo. Por favor, intenta volver a la
            página anterior.</p>
        <a href="javascript:history.back()" class="btn-back">Regresar</a>
    </div>
</body>

</html>
